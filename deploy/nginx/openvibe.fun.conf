## ═══════════════════════════════════════════════════════════════
## openvibe.fun — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.fun.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 5140, systemd unit openvibe-fun) renders every page and serves
## the API; nginx terminates TLS, redirects www → apex, rate-limits sign-in, the API and the form writes, and
## compresses text.
##
## No proxy_cache: the app decides cacheability per response (public for the guide and public quests/plans;
## private, no-store for anything drawn for a signed-in person or a board share page). Never log request bodies.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=fun_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=fun_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=fun_forms:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.fun www.openvibe.fun;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.fun$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.fun;

    ssl_certificate     /etc/letsencrypt/live/openvibe.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.fun/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.fun$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.fun;
    include snippets/security-txt.conf;

    ssl_certificate     /etc/letsencrypt/live/openvibe.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.fun/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.fun.access.log;
    error_log  /var/log/nginx/openvibe.fun.error.log;

    # The API's JSON body cap is 64 KB; leave room for the headers.
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints ───────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=fun_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5140;
    }

    location /auth/ {
        limit_req zone=fun_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5140;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=fun_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5140;
    }

    # ── The OBS overlay: a browser source may refresh every 15 s; keep it cheap ──
    location /overlay/ {
        limit_req zone=fun_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5140;
    }

    # ── Forms and other writes: the board, a suggestion, a vote, a plan, a report ──
    location = /quests/boards {
        limit_req zone=fun_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5140;
    }
    location ~ ^/quests/boards/[^/]+/(suggest|idea)$ {
        limit_req zone=fun_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5140;
    }
    location ~ ^/quests/[a-z0-9-]+/(vote|accept|live|complete|verify|hide|report)$ {
        limit_req zone=fun_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5140;
    }
    location = /plans {
        limit_req zone=fun_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5140;
    }
    location ~ ^/plans/[a-z0-9-]+/(options|vote|decide|today|hide|report)$ {
        limit_req zone=fun_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5140;
    }
    location ~ ^/q/[a-z0-9-]+/report$ {
        limit_req zone=fun_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5140;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:5140/metrics) ──
    location ~* ^/metrics(/|$) { return 404; }

    # ── OpenVibe.Events' account delivery route: loopback only (POST /internal/events) ──
    # Events posts to http://127.0.0.1:5140/internal/events directly. Never proxied from outside (ADR-033).
    location ~* ^/internal(/|$) { return 404; }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:5140;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
